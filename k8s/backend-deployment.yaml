apiVersion: apps/v1
kind: Deployment
metadata:
  name: bjjvault-backend
  labels:
    app: bjjvault-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bjjvault-backend
  template:
    metadata:
      labels:
        app: bjjvault-backend
    spec:
      containers:
        - name: backend
          image: ${ACR_LOGIN_SERVER}/bjjvault-backend:${IMAGE_TAG}
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: bjjvault-backend-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: bjjvault-backend
spec:
  type: LoadBalancer
  selector:
    app: bjjvault-backend
  ports:
    - port: 80
      targetPort: 8000
