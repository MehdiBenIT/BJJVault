# Copy to backend-secret.yaml (gitignored), fill in real values, then:
#   kubectl apply -f backend-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: bjjvault-backend-secrets
type: Opaque
stringData:
  DATABASE_URL: "mssql+pyodbc://<user>:<password>@<server>.database.windows.net:1433/bjjvault?driver=ODBC+Driver+18+for+SQL+Server"
  JWT_SECRET: "generate-a-long-random-string"
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  APPLE_CLIENT_ID: ""
  APPLE_CLIENT_SECRET: ""
  OAUTH_REDIRECT_BASE_URL: "https://<your-apim-gateway-url>"
  FRONTEND_BASE_URL: "https://<your-static-web-app-hostname>"
  APPLICATIONINSIGHTS_CONNECTION_STRING: ""
